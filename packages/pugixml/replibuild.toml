[project]
name = "pugixml"
version = "1.15"
uuid = "1e53df11-b979-4cc5-ae16-70a8a666cfc7"
root = "."

[dependencies]
pugixml = { type = "git", url = "https://github.com/zeux/pugixml.git", tag = "v1.15", commit = "ee86beb30e4973f5feffe3ce63bfa4fbadf72f38" }

[compile]
# One translation unit, so -fstandalone-debug is the cheap complete-type
# flag. xml_node / xml_attribute are header aggregates returned by value.
flags = ["-std=c++17", "-fPIC", "-fstandalone-debug"]
parallel = true

[link]
enable_lto = false
optimization_level = "2"

[binary]
type = "shared"

[wrap]
style = "clang"
language = "cpp"
use_clang_jl = true
enabled = true

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
