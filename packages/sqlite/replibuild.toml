[project]
name = "sqlite"
version = "3.53.3"

# Amalgamation mirror. The original algoritnl/sqlite-amalgamation went private
# (git prompts for a username → clone fails), so we track rhuijben's mirror, which
# follows upstream on master (3.53.3 here). Its version *tags* are frozen at 3.8.10,
# so pin the exact master commit instead — reproducible, and `git checkout <sha>` is
# supported. The whole repo has only two .c files (sqlite3.c + shell.c); excluding
# the shell CLI leaves a single self-contained amalgamation TU (no configure/codegen).
[dependencies.sqlite]
type = "git"
url = "https://github.com/rhuijben/sqlite-amalgamation.git"
tag = "717732275b11daf24c44c3621bf11e09c4216316"   # = SQLITE_VERSION 3.53.3
exclude = ["shell.c"]

[compile]
flags = ["-O2", "-fPIC", "-DSQLITE_THREADSAFE=1", "-DSQLITE_ENABLE_FTS5", "-DSQLITE_ENABLE_RTREE", "-DSQLITE_ENABLE_COLUMN_METADATA", "-DSQLITE_DQS=0"]

[link]
enable_lto = false
optimization_level = "0"
link_libraries = ["pthread", "dl", "m"]

[binary]
type = "shared"

[wrap]
language = "c"
shim_headers = ["sqlite3.h"]

# ── Variadic functions ──
# sqlite3_mprintf(const char *fmt, ...) → char*
# sqlite3_snprintf(int n, char *buf, const char *fmt, ...) → char*
[wrap.varargs]
sqlite3_mprintf = [
    ["Cstring"],
    ["Cint"],
    ["Cdouble"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
    ["Cint", "Cstring"],
    ["Cstring", "Cint", "Cstring"],
]
sqlite3_snprintf = [
    ["Cstring"],
    ["Cint"],
    ["Cdouble"],
    ["Cstring", "Cint"],
]
sqlite3_log = [
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
]

# ── Owned char* returns ──
# sqlite3_mprintf allocates its result via sqlite3_malloc; the caller must release
# it with sqlite3_free. Declare it owned so the wrapper copies to a Julia String and
# frees the C buffer (v2.5.10 [wrap.cstring_owned]) instead of leaking on every call.
# (sqlite3_snprintf writes into a caller-provided buffer — NOT owned — so it is absent.)
[wrap.cstring_owned]
sqlite3_mprintf = "sqlite3_free"

# ── Destructor sentinels ──
# SQLITE_STATIC = ((sqlite3_destructor_type)0)
# SQLITE_TRANSIENT = ((sqlite3_destructor_type)-1)
# Value macros (no "args" key) — shimmed as bare expressions, not function calls

[wrap.macros.SQLITE_STATIC]
ret = "sqlite3_destructor_type"

[wrap.macros.SQLITE_TRANSIENT]
ret = "sqlite3_destructor_type"

# ── Result codes (value macros) ──

[wrap.macros.SQLITE_OK]
ret = "int"

[wrap.macros.SQLITE_ERROR]
ret = "int"

[wrap.macros.SQLITE_BUSY]
ret = "int"

[wrap.macros.SQLITE_MISUSE]
ret = "int"

[wrap.macros.SQLITE_ROW]
ret = "int"

[wrap.macros.SQLITE_DONE]
ret = "int"

[wrap.macros.SQLITE_CONSTRAINT]
ret = "int"

[wrap.macros.SQLITE_ABORT]
ret = "int"

[wrap.macros.SQLITE_NOMEM]
ret = "int"

# ── Fundamental type codes (returned by sqlite3_column_type) ──

[wrap.macros.SQLITE_INTEGER]
ret = "int"

[wrap.macros.SQLITE_FLOAT]
ret = "int"

[wrap.macros.SQLITE_TEXT]
ret = "int"

[wrap.macros.SQLITE_BLOB]
ret = "int"

[wrap.macros.SQLITE_NULL]
ret = "int"

# ── Open flags (for sqlite3_open_v2) ──

[wrap.macros.SQLITE_OPEN_READONLY]
ret = "int"

[wrap.macros.SQLITE_OPEN_READWRITE]
ret = "int"

[wrap.macros.SQLITE_OPEN_CREATE]
ret = "int"

[wrap.macros.SQLITE_OPEN_MEMORY]
ret = "int"

[wrap.macros.SQLITE_OPEN_NOMUTEX]
ret = "int"

[wrap.macros.SQLITE_OPEN_FULLMUTEX]
ret = "int"

# ── UTF encoding flags (for sqlite3_create_function_v2) ──

[wrap.macros.SQLITE_UTF8]
ret = "int"

[wrap.macros.SQLITE_DETERMINISTIC]
ret = "int"

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
