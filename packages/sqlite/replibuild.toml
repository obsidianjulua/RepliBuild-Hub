[project]
name = "sqlite"
version = "3.49.1"
root = "."

[dependencies.sqlite]
type = "git"
url = "https://github.com/nicedoc/sqlite-amalgamation.git"
tag = "3.49.1"

[compile]
flags = ["-O2", "-fPIC", "-DSQLITE_ENABLE_FTS5", "-DSQLITE_ENABLE_JSON1", "-DSQLITE_ENABLE_RTREE"]

[link]
enable_lto = true
optimization_level = "2"

[binary]
type = "shared"

[wrap]
language = "c"
shim_headers = ["sqlite3.h"]

# printf-style varargs — each entry lists ONLY the variadic arg types
# sqlite3_mprintf(const char *fmt, ...)
# sqlite3_snprintf(int n, char *buf, const char *fmt, ...)
# sqlite3_log(int errCode, const char *fmt, ...)
[wrap.varargs]
sqlite3_mprintf = [
    ["Cstring"],
    ["Cint"],
    ["Cdouble"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
]
sqlite3_snprintf = [
    ["Cstring"],
    ["Cint"],
]
sqlite3_log = [
    ["Cstring"],
    ["Cint"],
]

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
