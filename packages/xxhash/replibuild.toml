[project]
name = "xxhash"
version = "0.8.3"
root = "."

[dependencies.xxhash]
type = "git"
url = "https://github.com/Cyan4973/xxHash.git"
tag = "v0.8.3"
exclude = ["tests", "cmake_unofficial", "cli", "doc", "xxh_x86dispatch.c", "xxh_x86dispatch.h"]

[compile]
flags = ["-O2", "-fPIC"]

[link]
enable_lto = true
optimization_level = "2"

[binary]
type = "shared"

[wrap]
language = "c"
shim_headers = ["xxhash.h"]

# XXH_versionNumber and XXH_VERSION_NUMBER are constants, not function macros
# Core hashing functions (XXH32, XXH64, XXH3_64bits etc.) are real functions

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
