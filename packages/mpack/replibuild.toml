[project]
name = "mpack"
version = "1.1.1"
root = "."

[dependencies.mpack]
type = "git"
url = "https://github.com/ludocode/mpack.git"
tag = "v1.1.1"
commit = "79d3fcd3e04338b06e82d01a62f4aa98c7bad5f7"
exclude = ["test", "docs", "tools"]

[compile]
flags = ["-O2", "-fPIC"]

[link]
# LTO off -> Tier 3 ccall for anything the slicer doesn't take. The
# whole-module `Base.llvmcall` payload is scale-limited and duplicates
# file-local statics (see cjson); sliced Tier 1 below is the supported path.
enable_lto = false
optimization_level = "2"

[binary]
type = "shared"

[wrap]
language = "c"
shim_headers = ["mpack/mpack.h"]

# Per-function bitcode slicing (declarations-only slices bound to the .so).
# Acceptance is gated by the Slicer + dlsym pre-flight; anything refused or
# hazardous demotes to Tier 3 ccall, and the @generated call sites demote in
# output mode. Off by default upstream; on here so the Hub exercises it.
[wrap.tier1]
enable = true

# No varargs in public API.
# The C11 _Generic mpack_write()/mpack_write_kv() macros cannot be shimmed —
# users call the typed functions directly: mpack_write_i32, mpack_write_cstr, etc.
# mpack_writer_init_stack/mpack_reader_init_stack use stack allocation, cannot be shimmed.

# mpack_expect_cstr_match wraps mpack_expect_str_match with strlen
[wrap.macros.mpack_expect_cstr_match]
ret = "void"
args = ["mpack_reader_t*", "const char*"]

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
