[project]
name = "jolt"
version = "5.7.0"
root = "."

# Jolt Physics: rigid bodies, constraints, characters, vehicles, soft bodies
# and ragdolls (Jolt/, 143 .cpp after the exclusions below). MIT licence.
#
# This is Jolt.cmake's Linux x86-64 source list in its "Distribution"
# configuration, with ObjectStream kept and the CPU compute backend (upstream's
# default on Linux); the other compute backends are left out:
#   Jolt/Compute/DX12, Jolt/Compute/VK   Windows-only / needs the Vulkan SDK's
#                                        glslc + dxc at build time; upstream
#                                        adds them only when found (VK) or on
#                                        WIN32 (DX12). Compute/MTL is .mm.
#   Samples, TestFramework, UnitTests,   consumers of the library, each with its
#   PerformanceTest, HelloWorld,         own main() and renderer
#   JoltViewer
#   Build, Docs, Assets                  CMake, doxygen, sample meshes
# Jolt/Renderer/*.cpp stay: upstream compiles them in every configuration and
# they reduce to nothing without JPH_DEBUG_RENDERER.
[dependencies.jolt]
type = "git"
url = "https://github.com/jrouwe/JoltPhysics.git"
tag = "v5.7.0"
commit = "cf16769bb0ede9c45d57d06068ff0689e9702f5c"
exclude = [
    "Jolt/Compute/DX12/",
    "Jolt/Compute/VK/",
    "Jolt/Compute/MTL/",
    "Samples/",
    "TestFramework/",
    "UnitTests/",
    "PerformanceTest/",
    "HelloWorld/",
    "JoltViewer/",
    "Build/",
    "Docs/",
    "Assets/",
]

[compile]
# From Build/CMakeLists.txt + Jolt/Jolt.cmake, clang on x86-64 Linux, the
# upstream option defaults except where noted:
#   -std=c++17 -pthread
#   -mavx2 -mbmi -mpopcnt -mlzcnt -mf16c -mfma -mfpmath=sse
#                     USE_AVX2/LZCNT/TZCNT/F16C/FMADD = ON (all on this CPU).
#                     Jolt/Core/Core.h turns __AVX2__, __FMA__, … into its own
#                     JPH_USE_* switches, so no -DJPH_USE_* is needed.
#   -ffp-contract=fast   USE_FMADD on x86 and not CROSS_PLATFORM_DETERMINISTIC
#   -DJPH_OBJECT_STREAM  ENABLE_OBJECT_STREAM = ON
#   -DJPH_USE_CPU_COMPUTE  USE_CPU_COMPUTE = ON (upstream's default)
# Left at their "Distribution" values (no define): JPH_DEBUG_RENDERER and
# JPH_PROFILE_ENABLED (both need an application-side renderer/profiler),
# JPH_ENABLE_ASSERTS, JPH_DOUBLE_PRECISION (positions are float: RVec3 = Vec3),
# JPH_CROSS_PLATFORM_DETERMINISTIC. JPH_SHARED_LIBRARY is not defined either:
# JPH_EXPORT is then empty and every symbol keeps default visibility.
# Upstream builds with -fno-rtti -fno-exceptions by default; both stay ON here
# (CPP_RTTI_ENABLED / CPP_EXCEPTIONS_ENABLED are upstream options) so the
# build's generated units and the library agree on typeinfo for every vtable.
# -fstandalone-debug: Jolt's value types (Vec3, Quat, Mat44, BodyID) and its
# *Settings structs are header-only; DWARF is the input.
flags = [
    "-O2", "-fPIC",
    "-std=c++17",
    "-fstandalone-debug",
    "-pthread",
    "-mavx2", "-mbmi", "-mpopcnt", "-mlzcnt", "-mf16c", "-mfma", "-mfpmath=sse",
    "-ffp-contract=fast",
    "-DJPH_OBJECT_STREAM",
    "-DJPH_USE_CPU_COMPUTE",
]
parallel = true
# shims/jolt_hub.cpp: Factory_New/RegisterTypes, which no pass wraps by
# design, and ContactRecorder, a C++ ContactListener (Jolt calls listeners
# from its worker threads); see the file's header. Vec3/Quat by value cross
# as Jolt's own functions (GENERATOR-simd-by-value-trapped.md, fixed).
source_files = ["shims/jolt_hub.cpp"]
include_dirs = [".replibuild_cache/deps/jolt"]

# Same reason as bullet3: every Jolt method is Tier 2 (C++ `this`, references,
# by-value Vec3/Quat), so compile the thunks once at build time.
aot_thunks = true

[link]
enable_lto = false
optimization_level = "2"
link_libraries = ["pthread"]

[binary]
type = "shared"

[wrap]
language = "cpp"
# Jolt/Jolt.h must come first in any unit (Core.h, Memory.h, STL wrappers).
# The rest is upstream HelloWorld.cpp's include list plus the three table
# classes that replace its hand-written layer interfaces.
shim_headers = [
    "Jolt/Jolt.h",
    "Jolt/RegisterTypes.h",
    "Jolt/Core/Factory.h",
    "Jolt/Core/TempAllocator.h",
    "Jolt/Core/JobSystemThreadPool.h",
    "Jolt/Core/JobSystemSingleThreaded.h",
    "Jolt/Physics/PhysicsSettings.h",
    "Jolt/Physics/PhysicsSystem.h",
    "Jolt/Physics/Collision/Shape/BoxShape.h",
    "Jolt/Physics/Collision/Shape/SphereShape.h",
    "Jolt/Physics/Body/BodyCreationSettings.h",
    "Jolt/Physics/Body/BodyActivationListener.h",
    "Jolt/Physics/Collision/BroadPhase/BroadPhaseLayerInterfaceTable.h",
    "Jolt/Physics/Collision/BroadPhase/ObjectVsBroadPhaseLayerFilterTable.h",
    "Jolt/Physics/Collision/ObjectLayerPairFilterTable.h",
]

[types]
# Header-only classes no Jolt .cpp mentions, so no CU's DWARF defines them
# (RepliBuild.jl #107). They are what an application needs to start a
# PhysicsSystem without subclassing anything:
#   TempAllocatorImpl                   the per-step scratch allocator
#   BroadPhaseLayerInterfaceTable       object layer -> broad-phase layer
#   ObjectVsBroadPhaseLayerFilterTable  derived from the two tables
#   ObjectLayerPairFilterTable          which object layers collide
# (upstream HelloWorld hand-writes the last three as subclasses).
records = [
    "JPH::TempAllocatorImpl",
    "JPH::BroadPhaseLayerInterfaceTable",
    "JPH::ObjectVsBroadPhaseLayerFilterTable",
    "JPH::ObjectLayerPairFilterTable",
]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
