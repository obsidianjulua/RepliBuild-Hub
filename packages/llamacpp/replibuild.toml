[project]
name = "llamacpp"
version = "b10286"
root = "."

# llama.cpp = libllama (src/) + ggml (ggml/src/), CPU + Vulkan backends.
#
# Admission-gate notes (why this is a source-build candidate and not an ingest):
#   * No configure script and no code generator on the path we build. The only
#     .in templates in the repo are pkg-config files (llama.pc.in, ggml.pc.in)
#     and common/build-info.cpp.in — none of them a header the core needs, and
#     common/ is excluded anyway.
#   * src/ and ggml/src/ pull in ZERO vendored deps (checked: no nlohmann,
#     minja, or cpp-httplib includes anywhere under either tree). vendor/ is
#     exclusively for common/ and tools/.
#   * One uniform flag set works because the arch- and backend-specific TUs are
#     all in their own directories and get excluded rather than re-flagged.
[dependencies.llamacpp]
type = "git"
url = "https://github.com/ggml-org/llama.cpp.git"
tag = "b10286"
commit = "cd0fa6051abd04fd7f82ccb42ad378ec43885455"
exclude = [
    # ── Consumers, not the library ──
    # (tests/, examples/, docs/ are already dropped by the resolver's walkdir filter)
    "common/",          # CLI arg parsing + chat glue; needs the generated build-info.cpp
    "tools/",
    "app/",
    "pocs/",
    # vendor/cpp-httplib/httplib.cpp is the one compilable TU under vendor/.
    # Nothing in src/ or ggml/src/ includes it (only tools/ does), but the
    # resolver walks the whole tree, so without this it compiles in and drags
    # the entire httplib::Server C++ surface into the DWARF the wrapper is
    # generated from.
    "vendor/",

    # ── Non-CPU ggml backends (each needs its own SDK + per-target flags) ──
    #
    # ggml-vulkan/ is NOT excluded — it is the GPU backend this package builds.
    # It survives the "one uniform flag set" rule: ggml-vulkan.cpp compiles
    # under exactly the flags below plus -DGGML_USE_VULKAN (verified, 107s for
    # that one TU — it is 19k lines and pulls in vulkan.hpp).
    #
    # Its shaders do NOT come from this clone. They are generated into
    # packages/llamacpp/vulkan/ by harvest_vulkan_shaders.sh and enter the build
    # as [dependencies.vkshaders]; see that script's header for why.
    "ggml-cuda/",
    "ggml-metal/",
    "ggml-sycl/",
    "ggml-opencl/",
    "ggml-blas/",
    "ggml-rpc/",
    "ggml-cann/",
    "ggml-hip/",
    "ggml-musa/",
    "ggml-webgpu/",
    "ggml-zdnn/",
    "ggml-zendnn/",
    "ggml-hexagon/",
    "ggml-openvino/",
    "ggml-virtgpu/",
    "ggml-et/",         # also the one backend with a real code generator (uberkernel .in files)

    # ── Non-x86 CPU arch variants (intrinsics for other ISAs) ──
    "arch/arm/",
    "arch/loongarch/",
    "arch/powerpc/",
    "arch/riscv/",
    "arch/s390/",
    "arch/wasm/",
    "kleidiai/",        # ARM
    "spacemit/",        # RISC-V

    # ── x86 TUs that need flags the single flag set can't carry ──
    "amx/",             # needs -mamx-int8/-mamx-tile
    "cpu-feats.cpp",    # runtime feature scoring; only built for GGML_BACKEND_DL variants

    # ── Host tools, not library code ──
    # vulkan-shaders-gen.cpp has a main(). It is the shader GENERATOR, built and
    # run by harvest_vulkan_shaders.sh at harvest time; linking it into the .so
    # drags a second entry point in. The .comp/.glsl files beside it are not
    # C/C++ extensions, so the resolver's walk already skips those.
    "vulkan-shaders-gen.cpp",

    # NOTE: ggml-backend-dl.cpp must NOT be excluded. The name suggests it is
    # gated on GGML_BACKEND_DL, but ggml-backend-reg.cpp calls dl_load_library
    # / dl_get_sym / dl_error UNCONDITIONALLY (no GGML_BACKEND_DL guard appears
    # in that file at all). Dropping it links a .so with three undefined
    # symbols, which only surfaces when something links against it.
]

# ggml-vulkan's shaders, harvested by harvest_vulkan_shaders.sh — 136 .cpp files
# holding SPIR-V as byte arrays, plus the header declaring them.
#
# A local dep rather than a source dir because that is the only mechanism the
# resolver has for compiling sources from OUTSIDE the dependency clone: the
# "local" branch walks the path for .cpp and adds every hit to extra_sources,
# and pushes the path onto extra_includes so ggml-vulkan.cpp finds
# ggml-vulkan-shaders.hpp.
#
# That branch applies NO exclude filtering and treats any .a/.so it finds as a
# link library, so this directory must hold nothing but the generated sources.
# The script rm -rf's it on each run for exactly that reason. It is gitignored
# (206 MB, regenerable) — see HUB.md.
[dependencies.vkshaders]
type = "local"
path = "vulkan"

[compile]
# -march=x86-64-v3: the SIMD level ggml's x86 path wants (AVX2 + FMA + F16C +
# BMI2), applied uniformly instead of per-file. Verified against this box's
# Ryzen 5 5600 (Zen 3 — full v3).
# -fstandalone-debug: load-bearing, same reason as box2d. llama.h's public
# "def" structs (llama_model_params, llama_context_params) are header-only
# aggregates the user must fill; clang's default limited debug info emits them
# as DW_AT_declaration-only stubs, which wrap to EMPTY Julia structs.
# -DGGML_USE_CPU: makes ggml-backend-reg.cpp statically register the CPU
# backend. Without it the registry is empty and every model load fails.
# GGML_VERSION/GGML_COMMIT: ggml.c returns these straight out of
# ggml_version()/ggml_commit() and CMake injects them as string defines
# (ggml/CMakeLists.txt:409). Nothing declares them in a header, so without
# these two ggml.c is the ONE TU in the tree that fails to compile.
#
# -DGGML_USE_VULKAN: the mirror of -DGGML_USE_CPU. ggml-backend-reg.cpp gates
# its static register_backend(ggml_backend_vk_reg()) call on it; without the
# define the Vulkan TUs compile and link but the registry never learns about the
# GPU, so n_gpu_layers > 0 silently does nothing. That file also honours
# GGML_DISABLE_VULKAN at RUNTIME, so this one build still gives a CPU-only path
# via the environment — no separate CPU package is needed.
#
# -fvisibility=hidden + the three *_SHARED defines: ONE mechanism, and the
# defines are not optional. GGML_API / GGML_BACKEND_API / LLAMA_API expand to
# __attribute__((visibility("default"))) ONLY inside `#ifdef GGML_SHARED` /
# `GGML_BACKEND_SHARED` / `LLAMA_SHARED` (ggml.h:176, ggml-backend.h:6,
# llama.h:15). Undefined, all three are a bare `extern`, and -fvisibility=hidden
# then hides the ENTIRE public API — llama_decode, llama_backend_init, ggml_init,
# the lot. The .so still links and the wrapper still generates; it is just empty
# of everything that matters. Checking that a function carries a GGML_API
# annotation proves nothing on its own — check that the macro is ACTIVE.
#
# The matching *_BUILD defines are upstream's dllexport/dllimport discriminator
# and are inert on the ELF and mingw paths, but they are what upstream pairs
# these with (ggml/src/CMakeLists.txt:287,515; src/CMakeLists.txt:61), and
# RepliBuild builds every TU into one .so, so both halves apply here.
#
# The point of hiding: the wrapper generator reads `nm -g --defined-only` and
# has no symbol filter, so without this it sees two floods:
#   * ~1,958 matmul_*_data / matmul_*_len byte-array globals PER shader TU,
#     across 136 TUs;
#   * the whole vk::*Error C++ class family out of vulkan.hpp — vtables and
#     non-virtual thunks for DeviceLostError, ExtensionNotPresentError and
#     friends. That is the same name-collision hazard class as wrapping a C++
#     library that exports `error`.
flags = [
    "-O2", "-fPIC", "-std=c++17",
    "-march=x86-64-v3",
    "-fstandalone-debug",
    "-fvisibility=hidden",
    "-DGGML_SHARED", "-DGGML_BUILD",
    "-DGGML_BACKEND_SHARED", "-DGGML_BACKEND_BUILD",
    "-DLLAMA_SHARED", "-DLLAMA_BUILD",
    "-DNDEBUG",
    "-DGGML_USE_CPU",
    "-DGGML_USE_VULKAN",
    "-D_GNU_SOURCE",
    '-DGGML_VERSION="0.18.1"',
    '-DGGML_COMMIT="b10286"',
]

# Compile the Tier-2 thunks at BUILD time into libllamacpp_thunks.so. Loading
# the wrapper is then a dlopen; otherwise every process rebuilds a 43k-line MLIR
# module and JITs it, which is the single most expensive thing it does.
aot_thunks = true
parallel = true

# The resolver auto-adds <clone>, <clone>/include and <clone>/src only. ggml
# lives at a non-standard depth, so its three include roots are named here.
# These are relative to the package dir because build() cd's there first.
include_dirs = [
    ".replibuild_cache/deps/llamacpp/ggml/include",
    ".replibuild_cache/deps/llamacpp/ggml/src",
    ".replibuild_cache/deps/llamacpp/ggml/src/ggml-cpu",
]

[link]
# LTO off — C++ default, and the whole-module llvmcall payload is parked
# anyway. Tier 2/3 for this one.
enable_lto = false
optimization_level = "2"
# vulkan = libvulkan.so, the ICD loader (vulkan-icd-loader). ggml-vulkan.cpp
# links the loader, not a driver; Mesa's ANV is picked up at runtime through the
# ICD manifest.
link_libraries = ["m", "pthread", "dl", "vulkan"]

[binary]
type = "shared"

[wrap]
language = "cpp"
# Both public headers are extern "C"; llama.h is the API proper, ggml.h carries
# the tensor/backend surface llama.h's types are built on.
shim_headers = ["llama.h", "ggml.h"]

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
