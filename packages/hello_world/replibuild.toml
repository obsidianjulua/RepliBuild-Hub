[llvm]
toolchain = "auto"

[compile]
flags = ["-std=c++17", "-fPIC"]
source_files = ["src/hello_world.cpp"]
parallel = true
include_dirs = [".", "src"]

[wrap]
enabled = true
language = "cpp"
use_clang_jl = true
style = "clang"

[cache]
enabled = true
directory = ".replibuild_cache"

[project]
name = "project"
root = "."
uuid = "58f8d42a-47f5-4a4e-8bb5-9cd4e0dd393f"

[discovery]
parse_ast = true
enabled = true
ignore_patterns = ["build", ".git", ".cache"]
walk_dependencies = true
max_depth = 10

[types]
allow_unknown_enums = false
allow_unknown_structs = true
allow_function_pointers = true
strictness = "warn"

[paths]
source = "src"
build = "build"
cache = ".replibuild_cache"
include = "include"
output = "julia"

[link]
optimization_level = "0"
enable_lto = false

[workflow]
stages = ["discover", "compile", "link", "binary", "wrap"]

[binary]
type = "shared"
strip_symbols = false
