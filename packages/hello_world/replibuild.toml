[project]
name = "hello_world"
root = "."

# Graph mode: CMakeLists.txt here declares two shared libraries, and the
# presence of [graph] makes RepliBuild take the build graph from CMake's File
# API (configure only) and compile/link each library with its own toolchain.
#
#   hello   owns hw::Vec2, hw::Mood, hw::Greeter (+ the Tier-2 exerciser fns)
#   world   links hello; embeds/returns/derives from/points at hello's types
#
# Selecting world brings hello along. wrap() writes julia/HelloWorld.jl, the
# graph module, with submodules Hello and World; since RepliBuild #80 a type
# both libraries use is defined once, by Hello, and World imports it — so
# HelloWorld.World.Vec2 === HelloWorld.Hello.Vec2.
#
# [compile] / [types] / per-library [wrap] keys do not apply in graph mode:
# flags come from CMake, and each library is wrapped with defaults.
[graph]
source = "."
targets = ["world"]
build_type = "Release"
