[project]
name = "lua"
version = "5.4.7"
root = "."

[dependencies.lua]
type = "git"
url = "https://github.com/lua/lua.git"
tag = "v5.4.7"
exclude = ["onelua.c", "lua.c", "luac.c", "ltests.c"]

[compile]
flags = ["-O1", "-fPIC", "-DLUA_USE_LINUX"]

[link]
enable_lto = false
optimization_level = "2"

[binary]
type = "shared"

[wrap]
language = "c"
shim_headers = ["lua.h", "lauxlib.h", "lualib.h"]

# Tier 1: per-function sliced llvmcall (un-parked 2026-07-22).
#
# setjmp status (verified 2026-07-31): the hazard gate is DIRECT-reach only —
# it demotes a function whose own slice body calls setjmp/longjmp or a
# returns_twice callee. Lua trips it nowhere: the protected-call machinery
# (_setjmp inside luaD_rawrunprotected) is .so-side behind promoted __rb_lua_*
# declares, so lua_error / lua_pcallk / lua_callk / lua_resume / lua_yieldk
# are all Tier 1 with zero setjmp_family hazards, and allow_setjmp is a no-op
# for this package. luaL_error is ccall because it is VARIADIC, not because of
# setjmp. longjmp across Julia frames is tier-independent (ccall has the
# identical exposure) and is exercised live by test_deep.jl (jl_fail callback).
[wrap.tier1]
enable = true

# lua_pushfstring(lua_State *L, const char *fmt, ...)
# Each entry lists ONLY the variadic arg types (fixed args come from DWARF)
[wrap.varargs]
lua_pushfstring = [
    ["Cstring"],
    ["Cint"],
    ["Cdouble"],
    ["Any"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
]

# lua_gc(lua_State *L, int what, ...) — data args for GCSTEP/GCGEN/GCINC;
# no-data calls (GCCOLLECT, GCCOUNT, ...) go through the base wrapper
lua_gc = [
    ["Cint"],
    ["Cint", "Cint"],
    ["Cint", "Cint", "Cint"],
]

# luaL_error(lua_State *L, const char *fmt, ...) — longjmps; only callable
# from inside a lua_CFunction running under pcall
luaL_error = [
    ["Cstring"],
    ["Cint"],
]

