[project]
name = "tinyxml2"
version = "10.0.0"
root = "."

[dependencies.tinyxml2]
type = "git"
url = "https://github.com/leethomason/tinyxml2.git"
tag = "10.0.0"
commit = "321ea883b7190d4e85cae5512a12e5eaa8f8731f"
exclude = ["xmltest.cpp"]

[compile]
# One translation unit. XMLNode and the document types are header-defined;
# limited debug info emits them as declaration stubs. -fstandalone-debug
# is cheap here. The lighter -Xclang -fno-use-ctor-homing is for a library
# big enough that full type debug would blow Clang's source-location budget.
flags = ["-O2", "-fPIC", "-std=c++17", "-fstandalone-debug"]

[link]
enable_lto = false
optimization_level = "2"

[binary]
type = "shared"

[wrap]
language = "cpp"

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

[cache]
enabled = true
