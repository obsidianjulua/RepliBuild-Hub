[wrap.macros.JS_STRIP_SOURCE]
ret = "int"

[wrap.macros.JS_STRIP_DEBUG]
ret = "int"

# ── Bytecode serialization (JS_WriteObject / JS_ReadObject)    quickjs.h:980-994 ──
# The format is tied to this QuickJS release (BC_VERSION 5 in quickjs.c), and
# no check is done before running loaded bytecode: load only bytecode you wrote.

[wrap.macros.JS_WRITE_OBJ_BYTECODE]
ret = "int"

[wrap.macros.JS_WRITE_OBJ_BSWAP]
ret = "int"

[wrap.macros.JS_WRITE_OBJ_SAB]
ret = "int"

[wrap.macros.JS_WRITE_OBJ_REFERENCE]
ret = "int"

[wrap.macros.JS_READ_OBJ_BYTECODE]
ret = "int"

[wrap.macros.JS_READ_OBJ_ROM_DATA]
ret = "int"

[wrap.macros.JS_READ_OBJ_SAB]
ret = "int"

[wrap.macros.JS_READ_OBJ_REFERENCE]
ret = "int"

# ── JSCFunctionListEntry kinds (for tables built in Julia)     quickjs.h:1099-1110 ──

[wrap.macros.JS_DEF_CFUNC]
ret = "int"

[wrap.macros.JS_DEF_CGETSET]
ret = "int"

[wrap.macros.JS_DEF_CGETSET_MAGIC]
ret = "int"

[wrap.macros.JS_DEF_PROP_STRING]
ret = "int"

[wrap.macros.JS_DEF_PROP_INT32]
ret = "int"

[wrap.macros.JS_DEF_PROP_INT64]
ret = "int"

[wrap.macros.JS_DEF_PROP_DOUBLE]
ret = "int"

[wrap.macros.JS_DEF_PROP_UNDEFINED]
ret = "int"

[wrap.macros.JS_DEF_OBJECT]
ret = "int"

[wrap.macros.JS_DEF_ALIAS]
ret = "int"

[wrap.macros.JS_DEF_PROP_ATOM]
ret = "int"

[wrap.macros.JS_DEF_PROP_BOOL]
