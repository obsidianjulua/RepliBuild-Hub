[project]
name = "imgui"
version = "1.92.9b"
root = "."

[dependencies.imgui]
type = "git"
url = "https://github.com/ocornut/imgui.git"
tag = "v1.92.9b"
commit = "f1cc2ae15e53a861a874c3034aae6798fde194ab"
# Core + GLFW platform backend + OpenGL3 renderer. The other 17 backend TUs
# each need an SDK that is not on this box (DX, Vulkan, SDL, Metal, …).
# examples/ is also a walkdir skip; misc/freetype needs freetype headers.
# Matching is file== / startswith / endswith / occursin against the path
# relative to the clone root — a bare filename is enough, and a blanket
# "backends" would drop the two TUs we now want.
exclude = [
    "examples",
    "misc/freetype",
    "imgui_impl_allegro5.cpp",
    "imgui_impl_android.cpp",
    "imgui_impl_dx9.cpp",
    "imgui_impl_dx10.cpp",
    "imgui_impl_dx11.cpp",
    "imgui_impl_dx12.cpp",
    "imgui_impl_glut.cpp",
    "imgui_impl_null.cpp",
    "imgui_impl_opengl2.cpp",
    "imgui_impl_sdl2.cpp",
    "imgui_impl_sdl3.cpp",
    "imgui_impl_sdlgpu3.cpp",
    "imgui_impl_sdlrenderer2.cpp",
    "imgui_impl_sdlrenderer3.cpp",
    "imgui_impl_vulkan.cpp",
    "imgui_impl_wgpu.cpp",
    "imgui_impl_win32.cpp",
]

[compile]
flags = ["-O2", "-fPIC", "-std=c++17"]
parallel = true
# Resolver auto-adds <clone>, <clone>/include, <clone>/src only. The two
# backend TUs #include "imgui_impl_glfw.h" / "imgui_impl_opengl3.h" from
# backends/. Relative to the package dir because build() cds there first.
include_dirs = [
    ".replibuild_cache/deps/imgui/backends",
]

# Compile the Tier-2 thunks at BUILD time into libimgui_thunks.so.
#
# imgui is the package where this matters most in the Hub. It is an
# IMMEDIATE-MODE api: the caller rebuilds the whole UI every frame, so a window
# with a few hundred widgets is a few hundred Tier-2 calls per frame at 60 Hz.
# On the JIT path every one of those resolves its thunk through
# `_lookup_cached(func_name)` — a lookup keyed by STRING — where the AOT path
# calls an already-resolved pointer held in a `Ref` slot.
#
# The other half is startup: without this, every process that says
# `using Imgui` rebuilds and JITs the MLIR module for 829 wrapped `ImGui::`
# functions before the first frame.
#
# Measured on the llamacpp wrapper, which is the same dispatch machinery:
# a Tier-2 AOT call is 19.5 ns and allocates 0 bytes/call (Julia's escape
# analysis elides the marshal `Vector` and `Ref`s — they never leave the
# `GC.@preserve` block), against 2.3 ns for a plain Tier-3 ccall. At 1000
# widget calls per frame that is 20 µs of a 16,667 µs frame budget.
aot_thunks = true

[link]
enable_lto = false
optimization_level = "2"
# GLFW platform backend → libglfw; OpenGL3 renderer → libGL. libimgui.so
# therefore DT_NEEDs both at runtime. The OpenGL3 backend ships its own
# loader (imgui_impl_opengl3_loader.h); do not add glad/GLEW/glbinding.
link_libraries = ["glfw", "GL"]

# Link against the HUB glfw package, not the distro copy.
#
# GLFW state is process-global. With imgui bound to /usr/lib/libglfw.so.3 and
# packages/glfw producing its own libglfw.so, loading both into one Julia
# session maps two GLFWs — measured — and `glfwInit()` on one does not
# initialise the other. A GLFWwindow* created through the Hub wrapper and
# handed to ImGui_ImplGlfw_InitForOpenGL (inside libimgui.so, bound to the
# other copy) is undefined behaviour. One copy is the only safe arrangement.
#
# `-L` alone would NOT achieve this: RepliBuild's output carries no SONAME, so
# the recorded DT_NEEDED is a bare `libglfw.so` and the loader finds
# /usr/lib/libglfw.so first. get_link_flags now emits `-Wl,-rpath` for every
# link_dir alongside `-L`, which is what makes the runtime resolution follow
# the build-time one. Verify after any rebuild:
#   readelf -d julia/libimgui.so | grep -E 'RUNPATH|NEEDED.*glfw'
#   ldd julia/libimgui.so | grep glfw     # must NOT say /usr/lib
#
# This makes imgui's build ORDER-DEPENDENT on packages/glfw: build that first,
# or this link fails with "cannot find -lglfw".
link_dirs = ["../glfw/julia"]

[binary]
type = "shared"

[wrap]
language = "cpp"
style = "clang"
use_clang_jl = true
enabled = true

[types]
strictness = "warn"
allow_unknown_structs = true
allow_function_pointers = true

# ── printf-family text API ───────────────────────────────────────────────────
# Keyed on the BARE DWARF name (`Text`), not the emitted Julia name
# (`ImGui_Text`) — see the `func_name` lookup in GeneratorCpp. Each entry lists
# ONLY the variadic tail; fixed args come from DWARF. One entry emits one
# method, named by its types: `ImGui_Text_Cstring`, `ImGui_Text_Cdouble_Cdouble`.
# Without this block every one of these is base-wrapper-only — `ImGui_Text` has
# a single `(Any)` method and the format arguments have nowhere to go.
#
# TYPES ARE POST-PROMOTION, AND THAT IS LOAD-BEARING. C default argument
# promotion applies to variadic args: float→double, char/short/bool→int. Julia's
# `@ccall f(fixed...; va::T)` passes exactly T with no promotion, and
# `_VARARG_ALLOWED_TYPES` accepts "Cfloat"/"Cchar"/"Cshort"/"Bool" without
# comment. So `["Cfloat"]` here would push 4 bytes into a slot printf reads as
# 8 — silent garbage, no crash. Every float slot below is Cdouble deliberately;
# ImVec2/ImVec4 components are floats in C++ and MUST be passed as Cdouble.
#
# OMITTED, deliberately:
#   TextAligned                — imgui_internal.h, upstream marks it
#                                "FIXME-WIP: API is likely to be reworked"
#   ImFormatString             — writes into a caller-supplied char* buf; needs
#                                buffer ergonomics, not a type list
#   ImFormatStringToTempBuffer — hands back pointers into imgui's per-frame temp
#                                buffer; lifetime is not expressible here
#   ImGuiTextBuffer::appendf   — container method, internal
#   AddLog                     — ExampleAppLog/ExampleAppConsole in
#                                imgui_demo.cpp; weak symbols, not API
[wrap.varargs]

# void Text(const char* fmt, ...)
Text = [
    ["Cint"],
    ["Cuint"],
    ["Cdouble"],
    ["Cstring"],
    ["Csize_t"],
    ["Cint", "Cint"],
    ["Cdouble", "Cdouble"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
    ["Cint", "Cdouble"],
    ["Cdouble", "Cint"],
    ["Cint", "Cint", "Cint"],
    ["Cdouble", "Cdouble", "Cdouble"],
    ["Cdouble", "Cdouble", "Cdouble", "Cdouble"],
]

# void TextDisabled(const char* fmt, ...)
TextDisabled = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cdouble", "Cdouble"],
]

# void TextWrapped(const char* fmt, ...)
TextWrapped = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cstring", "Cstring"],
]

# void TextColored(const ImVec4& col, const char* fmt, ...)
# Fixed `col` arrives as Ref{ImVec4}; only the tail is listed here.
TextColored = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cdouble", "Cdouble"],
]

# void BulletText(const char* fmt, ...)
BulletText = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
]

# void LabelText(const char* label, const char* fmt, ...)
# The value side of a label/value row — numeric tails carry the weight.
LabelText = [
    ["Cint"],
    ["Cuint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cint", "Cint"],
    ["Cdouble", "Cdouble"],
    ["Cdouble", "Cdouble", "Cdouble"],
    ["Cdouble", "Cdouble", "Cdouble", "Cdouble"],
]

# void SetTooltip(const char* fmt, ...)
SetTooltip = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cdouble", "Cdouble"],
]

# void SetItemTooltip(const char* fmt, ...)
SetItemTooltip = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
    ["Cdouble", "Cdouble"],
]

# bool TreeNode(const char* str_id, const char* fmt, ...)
# bool TreeNode(const void* ptr_id, const char* fmt, ...)
# Two C++ overloads share this key; each gets the full set, distinguished by
# the fixed first arg (Cstring vs Ptr) in the emitted signature.
TreeNode = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
]

# bool TreeNodeEx(const char* str_id, ImGuiTreeNodeFlags flags, const char* fmt, ...)
# bool TreeNodeEx(const void* ptr_id, ImGuiTreeNodeFlags flags, const char* fmt, ...)
# `flags` is fixed (ImGuiTreeNodeFlags → Cint), so the tail matches TreeNode.
TreeNodeEx = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
]

# void LogText(const char* fmt, ...) — straight to the log, never displayed
LogText = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
]

# void DebugLog(const char* fmt, ...)
DebugLog = [
    ["Cint"],
    ["Cdouble"],
    ["Cstring"],
    ["Cstring", "Cint"],
]

[cache]
enabled = true
