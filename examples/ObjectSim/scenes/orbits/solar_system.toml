# The Sun, the eight planets and the Moon, from approximate J2000 mean orbital
# elements (a in AU; e; i, node, peri and the mean anomaly M in degrees, all
# relative to the ecliptic). Masses in solar masses, radii in AU. Good for
# looking at, not for predicting where Mars is tonight: the elements are
# rounded and there is no relativity, no oblateness, no asteroids.
#
#   julia --project=examples/ObjectSim examples/ObjectSim/orbits.jl examples/ObjectSim/scenes/orbits/solar_system.toml

[system]
units = "solar"

[view]
days_per_second = 20
exaggerate = 50                 # drawn 50× real size (more would swallow the Moon's orbit)
scale = 10
distance = 4.5                  # start on the inner planets; scroll out for the rest

[[body]]
name = "Sun"
mass = 1.0
radius = 0.00465
display_radius = 0.12
color = "#ffcf4d"

[[body]]
name = "Mercury"
mass = 1.6601e-7
radius = 1.63e-5
color = "#a9a39b"
orbit = { around = "Sun", a = 0.38710, e = 0.20563, i = 7.005, node = 48.331, peri = 29.124, M = 174.796 }

[[body]]
name = "Venus"
mass = 2.4478e-6
radius = 4.05e-5
color = "#e8c27a"
orbit = { around = "Sun", a = 0.72333, e = 0.00677, i = 3.3946, node = 76.680, peri = 54.884, M = 50.115 }

[[body]]
name = "Earth"
