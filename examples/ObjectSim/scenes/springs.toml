# Springs: everything hangs from the beam at its unstretched length and is let
# go, so it drops and bounces about the point Hooke's law puts it, m·g/k lower.
# Grab any mass and pull it, then let go: that is a stretch and release.
#
#   left four    same spring (k = 50), mass 0.5, 1, 2, 4 kg: the period grows
#                as √m (0.63, 0.89, 1.26, 1.78 s) and so does the drop
#   middle five  1 kg on k = 50, damping 0, 1.4, 7, 14, 42 N·s/m: ζ = 0, 0.1,
#                0.5, 1 (critical: back without overshoot, fastest), 3 (slow creep)
#   right        two 1 kg masses in series: two normal modes at once
#   back         twelve beads on springs in zero g, fixed at both ends: pull one
#                sideways or along the line and watch the wave run and reflect
#
# Spring forces are exact (see src/joints.jl): measured, periods match
# 2π√(m/k) to 0.03%, sag matches m·g/k, decay rates match c/2m. A spring stiffer
# than the step rate can follow is solved implicitly: stable, the ringing it
# can't show dies out (the log says so, with the hz that would show it).

[world]
gravity = [0, -9.81, 0]
hz = 240

[camera]
target = [0.5, 3.2, -1]
distance = 17
yaw = 15
pitch = 24
orbit = false

[[object]]
name = "floor"
shape = "box"
size = [30, 1, 20]
position = [0, -0.5, 0]
mass = 0
color = "#3a3f4b"

[[object]]
name = "beam"
shape = "box"
size = [14, 0.25, 0.4]
position = [0.5, 6.15, 0]
mass = 0
color = "#8a8f9a"

# ── same spring, four masses ────────────────────────────────────────────────
[[object]]
name = "m_half"
shape = "sphere"
radius = 0.16
mass = 0.5
position = [-5.5, 4.5, 0]
color = "#e8b33a"

[[object]]
name = "m_1"
shape = "sphere"
radius = 0.2
mass = 1
position = [-4.5, 4.5, 0]
color = "#e8b33a"

[[object]]
name = "m_2"
shape = "sphere"
radius = 0.25
mass = 2
position = [-3.5, 4.5, 0]
color = "#e8b33a"

[[object]]
name = "m_4"
shape = "sphere"
radius = 0.32
mass = 4
position = [-2.5, 4.5, 0]
color = "#e8b33a"

[[joint]]
type = "spring"
a = "m_half"
pivot = [-5.5, 6, 0]
stiffness = 50
damping = 0.1

[[joint]]
type = "spring"
a = "m_1"
pivot = [-4.5, 6, 0]
stiffness = 50
damping = 0.1

[[joint]]
type = "spring"
a = "m_2"
pivot = [-3.5, 6, 0]
stiffness = 50
damping = 0.1

[[joint]]
type = "spring"
a = "m_4"
pivot = [-2.5, 6, 0]
stiffness = 50
damping = 0.1

# ── one spring, five dampings ───────────────────────────────────────────────
[[object]]
name = "zeta"
shape = "box"
size = [0.35, 0.35, 0.35]
mass = 1
position = [-1, 4.5, 0]
repeat = 5
step = [1, 0, 0]
color = "#3d8bd9"

[[joint]]
name = "zeta_0"
type = "spring"
a = "zeta[1]"
pivot = [-1, 6, 0]
stiffness = 50
damping = 0

[[joint]]
name = "zeta_0.1"
type = "spring"
a = "zeta[2]"
pivot = [0, 6, 0]
stiffness = 50
damping = 1.414

[[joint]]
name = "zeta_0.5"
type = "spring"
a = "zeta[3]"
pivot = [1, 6, 0]
stiffness = 50
damping = 7.07

[[joint]]
name = "zeta_1"
type = "spring"
a = "zeta[4]"
pivot = [2, 6, 0]
stiffness = 50
damping = 14.14

[[joint]]
name = "zeta_3"
type = "spring"
a = "zeta[5]"
pivot = [3, 6, 0]
stiffness = 50
damping = 42.4

# ── two masses in series ────────────────────────────────────────────────────
[[object]]
name = "upper"
shape = "sphere"
radius = 0.22
mass = 1
position = [5.5, 5, 0]
color = "#d94f3d"

[[object]]
name = "lower"
shape = "sphere"
radius = 0.22
mass = 1
position = [5.5, 4, 0]
color = "#d94f3d"

[[joint]]
type = "spring"
a = "upper"
pivot = [5.5, 6, 0]
stiffness = 60
damping = 0.1

[[joint]]
type = "spring"
a = "upper"
b = "lower"
pivot = [5.5, 4.5, 0]
stiffness = 60
damping = 0.1

# ── a bead chain in zero g ──────────────────────────────────────────────────
[[object]]
name = "post"
shape = "box"
size = [0.3, 2.5, 0.3]
position = [-5.6, 1.25, -4]
repeat = [2, 1, 1]
spacing = [11.2, 0, 0]
mass = 0
color = "#8a8f9a"

[[object]]
name = "bead"
shape = "sphere"
radius = 0.17
mass = 0.3
gravity = [0, 0, 0]
position = [-4.8, 2.2, -4]
repeat = 12
step = [0.873, 0, 0]
color = "#4fb06a"

[[joint]]
type = "spring"
chain = "bead"
ends = "both"
stiffness = 80
damping = 0.05
