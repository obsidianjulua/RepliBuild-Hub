# Joints doing things:
# - a sweeper arm on a motorised hinge, turning through crates and a glued
#   tower whose fixed joints snap when hit hard enough (break_impulse);
# - three boxes hanging from springs of different stiffness;
# - a pendulum wave: ten pendulums whose lengths are tuned so they drift in and
#   out of step (see below).

[world]
gravity = [0, -9.81, 0]
hz = 240
iterations = 50               # solver passes: the pendulum periods need more than the default 10

[camera]
target = [0, 1.8, 1]
distance = 20
yaw = 18
pitch = 26
orbit = false

[[object]]
name = "floor"
shape = "box"
size = [60, 1, 60]
position = [0, -0.5, 0]
mass = 0
color = "#3a3f4b"

# ── sweeper: a long arm turning about Y at its centre ───────────────────────
[[object]]
name = "hub"
shape = "cylinder"
radius = 0.35
height = 0.8
position = [-4, 0.4, 0]
mass = 0
color = "#6b7280"

[[object]]
name = "arm"
shape = "box"
size = [6, 0.35, 0.35]
mass = 20
position = [-4, 0.35, 0]
friction = 0.3
color = "#d94f3d"

[[joint]]
name = "motor"
type = "hinge"
a = "arm"
pivot = [-4, 0.35, 0]
axis = [0, 1, 0]
motor = [50, 40]              # 50°/s, up to 40 N·s per step

[[object]]
name = "crate"
shape = "box"
size = [0.6, 0.6, 0.6]
mass = 1
position = [-6.2, 0.3, 1.6]
repeat = [3, 2, 1]
spacing = [0.65, 0.6, 1]
color = "#c98a3d"

[[object]]
name = "block"
shape = "box"
size = [0.5, 0.5, 0.5]
mass = 1
position = [-1.6, 0.25, -0.6]
repeat = [1, 6, 1]
spacing = [0, 0.5, 0]
color = "#e8b33a"

[[joint]]
name = "glue"
type = "fixed"
chain = "block"
break_impulse = 1.2          # holds the tower up, snaps when the arm hits it

# ── springs ────────────────────────────────────────────────────────────────
[[object]]
name = "frame"
shape = "box"
size = [4.4, 0.2, 0.2]
position = [4, 4.6, -1.5]
mass = 0
color = "#6b7280"

[[object]]
name = "soft"
shape = "box"
size = [0.6, 0.6, 0.6]
position = [2.6, 2.5, -1.5]
velocity = [0, -3, 0]
color = "#4fb06a"

[[object]]
name = "medium"
shape = "box"
size = [0.6, 0.6, 0.6]
position = [4.0, 2.5, -1.5]
velocity = [0, -3, 0]
color = "#38b2ac"

[[object]]
name = "stiff"
shape = "box"
size = [0.6, 0.6, 0.6]
position = [5.4, 2.5, -1.5]
velocity = [0, -3, 0]
color = "#3d8bd9"

[[joint]]
type = "spring"
a = "soft"
pivot = [2.6, 4.5, -1.5]
stiffness = 25
damping = 0.3

[[joint]]
type = "spring"
a = "medium"
pivot = [4.0, 4.5, -1.5]
stiffness = 80
damping = 0.3

[[joint]]
type = "spring"
a = "stiff"
pivot = [5.4, 4.5, -1.5]
stiffness = 300
damping = 0.3

# ── pendulum wave: ten pendulums on point joints, all let go from 15°. In a
# 30 s cycle pendulum k swings 15 + k times, so they fall in and out of step
# and line up again at 30 s. Lengths solve T₀ = 2π√((L² + ⅖r²)/(gL)), the bob
# being a 0.08 m sphere, with T₀ = T/(1 + θ²/16) for the 15° swing (a wide
# swing is slower than the small-angle period) and T = 30/(15 + k).
[[object]]
name = "wave_bar"
shape = "box"
size = [3.2, 0.1, 0.1]
position = [4.0, 3.2, 2.5]
mass = 0
color = "#6b7280"

[[object]]
name = "bob1"
shape = "sphere"
radius = 0.08
mass = 0.5
sleep = false
position = [2.65, 2.2506, 2.75439]
friction = 0
color = "#e8e8e8"

[[joint]]
type = "point"
a = "bob1"
pivot = [2.65, 3.2, 2.5]                # L = 0.9829 m, T = 2.0 s

[[object]]
name = "bob2"
shape = "sphere"
radius = 0.08
mass = 0.5
sleep = false
position = [2.95, 2.36622, 2.72341]
friction = 0
color = "#e8e8e8"

[[joint]]
