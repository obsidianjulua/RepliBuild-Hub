# An open floor with a few things on it, for trying the controls:
# carry things with the left mouse button, F to throw, 1-6 to drop shapes,
# E to blast, G to switch gravity off. H shows every key.

[world]
gravity = [0, -9.81, 0]
hz = 120

[camera]
target = [0, 1, 0]
distance = 16
yaw = 25
pitch = 24
orbit = false

[[object]]
name = "floor"
shape = "box"
size = [60, 1, 60]
position = [0, -0.5, 0]
mass = 0
color = "#3a3f4b"

[[object]]
name = "ramp"
shape = "mesh"
asset = "../assets/ramp.obj"
position = [-5, 0, -2]
rotation = [0, 180, 0]
color = "#8a7a5c"

[[object]]
name = "tower"
shape = "box"
size = [0.7, 0.7, 0.7]
position = [2.5, 0.35, -1]
repeat = [2, 6, 2]
spacing = [0.72, 0.7, 0.72]
friction = 0.7
color = "#c98a3d"

[[object]]
name = "ball"
shape = "sphere"
radius = 0.35
position = [-1.5, 0.35, 2]
repeat = [3, 1, 1]
spacing = [0.9, 0, 0]
rolling_friction = 0.02
restitution = 0.4
color = "#3d8bd9"

[[object]]
name = "pin"
shape = "cylinder"
radius = 0.15
height = 0.9
mass = 0.5
position = [5, 0.45, 3]
repeat = [3, 1, 3]
spacing = [0.45, 0, 0.45]
color = "#e8e8e8"

[[object]]
name = "rock"
shape = "hull"
asset = "../assets/rock.obj"
mass = 3
position = [-3, 0.5, 4]
friction = 0.8
rolling_friction = 0.05
color = "#9a8f80"

[[object]]
name = "lamp"                   # glowing: self-lit, so they bloom (B toggles bloom)
shape = "sphere"
radius = 0.3
mass = 0.5
position = [0, 0.3, -3]
repeat = [3, 1, 1]
spacing = [1.2, 0, 0]
glow = 1.0
rolling_friction = 0.02
color = "#ffb347"
