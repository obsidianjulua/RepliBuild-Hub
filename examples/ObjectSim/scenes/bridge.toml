# A rope bridge: twelve planks joined edge to edge by hinges (`chain`, axis
# along Z), both ends hinged to the towers. Crates and balls drop onto it.

[world]
gravity = [0, -9.81, 0]
hz = 120

[camera]
target = [0, 2.5, 0]
distance = 17
yaw = 28
pitch = 22
orbit = false

[[object]]
name = "floor"
shape = "box"
size = [60, 1, 60]
position = [0, -0.5, 0]
mass = 0
color = "#3a3f4b"

[[object]]
name = "tower_left"
shape = "box"
size = [1.5, 4, 3]
position = [-6.75, 2, 0]
mass = 0
color = "#6b7280"

[[object]]
name = "tower_right"
shape = "box"
size = [1.5, 4, 3]
position = [6.75, 2, 0]
mass = 0
color = "#6b7280"

[[object]]
name = "plank"
shape = "box"
size = [0.9, 0.12, 2.2]
mass = 1.5
position = [-5.5, 3.94, 0]
repeat = [12, 1, 1]
spacing = [1.0, 0, 0]
friction = 0.8
color = "#8a6a45"

[[joint]]
name = "rope"
type = "hinge"
chain = "plank"
ends = "both"
axis = [0, 0, 1]

[[object]]
name = "crate"
shape = "box"
size = [0.7, 0.7, 0.7]
mass = 3
position = [-2.5, 7, 0]
repeat = [3, 1, 1]
spacing = [2.5, 0, 0]
rotation = [0, 25, 0]
color = "#c98a3d"

[[object]]
name = "ball"
shape = "sphere"
radius = 0.35
mass = 2
position = [-1.2, 9, 0.5]
repeat = [3, 1, 1]
spacing = [1.2, 0, 0]
restitution = 0.3
rolling_friction = 0.02
color = "#3d8bd9"
