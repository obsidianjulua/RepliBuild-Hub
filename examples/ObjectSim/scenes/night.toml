# Night: the main light turned down to moonlight, and the scene lit by lamps.
# Objects with `light` are point lights of their own colour; the lantern hangs
# on a chain and swings, so its light sweeps across the room. Press 7 to drop
# more lamps, carry them about with the mouse, B for bloom.

[world]
gravity = [0, -9.81, 0]
hz = 120

[lighting]
sun = 0.12                      # moonlight; it still casts the (faint) shadows
ambient = 0.3
sky = "#07080c"

[camera]
target = [0, 1.5, 0]
distance = 17
yaw = 25
pitch = 28
orbit = false

[[object]]
name = "floor"
shape = "box"
size = [40, 1, 40]
position = [0, -0.5, 0]
mass = 0
color = "#8a8f9a"

[[object]]
name = "pillar"
shape = "cylinder"
radius = 0.35
height = 4
mass = 0
position = [-4, 2, -4]
repeat = [3, 1, 3]
spacing = [4, 0, 4]
color = "#c8c3b8"

[[object]]
name = "crate"
shape = "box"
size = [0.8, 0.8, 0.8]
position = [1.6, 0.4, 1.6]
repeat = [2, 3, 2]
spacing = [0.82, 0.8, 0.82]
color = "#c98a3d"

[[object]]
name = "ball"
shape = "sphere"
radius = 0.35
position = [-1.5, 0.35, 2.5]
repeat = [3, 1, 1]
spacing = [0.9, 0, 0]
color = "#e8e8e8"

[[object]]
name = "warm_lamp"
shape = "sphere"
radius = 0.25
mass = 0.5
position = [-2.5, 0.25, -1.5]
glow = 1
light = 6
color = "#ffb347"

[[object]]
name = "teal_lamp"
shape = "sphere"
radius = 0.25
mass = 0.5
position = [3.5, 0.25, -2.5]
glow = 1
light = 6
color = "#40e0d0"

[[object]]
name = "pink_lamp"
shape = "sphere"
radius = 0.25
mass = 0.5
position = [-3, 0.25, 3.5]
glow = 1
light = 5
color = "#ff5ab4"

# ── a lantern on a chain, let go from the side ─────────────────────────────
[[object]]
name = "beam"
shape = "box"
size = [0.3, 0.3, 3]
position = [0, 5.2, 0]
mass = 0
color = "#6b7280"

[[object]]
name = "link"
shape = "capsule"
radius = 0.04
height = 0.5
mass = 0.3
position = [-0.1607, 4.8085, 0]       # anchor (0, 5, 0) + d · 0.25, d = (−sin 40°, −cos 40°, 0)
rotation = [0, 0, 140]
repeat = 6
step = [-0.3214, -0.3830, 0]           # d · 0.5
color = "#9aa0aa"

[[object]]
name = "lantern"
shape = "sphere"
radius = 0.3
mass = 2
position = [-2.121, 2.473, 0]          # anchor + d · (3 + 0.3)
glow = 1
light = 8
light_intensity = 2.0
color = "#ffe0a0"
sleep = false

[[joint]]
type = "point"
chain = "link"
ends = "first"

[[joint]]
type = "point"
a = "link[6]"
b = "lantern"
pivot = [-1.928, 2.702, 0]             # anchor + d · 3
